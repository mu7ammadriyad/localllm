name: localllm-test

on:
  workflow_dispatch: {}

jobs:
  test-localllm:
    runs-on: ubuntu-latest

    # أقل من الحد الأقصى لـ GitHub Actions
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1) تثبيت llama.cpp / llama CLI
      # ============================================================
      - name: تثبيت llama
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "تثبيت llama..."
          echo "=========================================="

          curl -LsSf https://llama.app/install.sh | sh

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$PATH"

          echo ""
          echo "إصدار llama:"
          llama --version || true

      # ============================================================
      # 2) تثبيت cloudflared
      # ============================================================
      - name: تثبيت cloudflared
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "تثبيت cloudflared..."
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared

          sudo mv cloudflared /usr/local/bin/cloudflared

          echo ""
          echo "إصدار cloudflared:"
          cloudflared --version

      # ============================================================
      # 3) تشغيل llama server
      # ============================================================
      - name: تشغيل سيرفر الموديل
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          echo "=========================================="
          echo "تشغيل llama server"
          echo "=========================================="
          
          MODEL="unsloth/gemma-4-E4B-it-GGUF"

          echo "الموديل:"
          echo "$MODEL"

          echo ""
          echo "بدء llama serve..."

          # نحذف أي log قديم
          rm -f llama.log

          # تشغيل السيرفر في الخلفية
          llama serve -hf "$MODEL" \
            --host 0.0.0.0 \
            --port 8080 \
            > llama.log 2>&1 &

          LLAMA_PID=$!

          echo "PID الخاص بـ llama:"
          echo "$LLAMA_PID"

          echo "$LLAMA_PID" > llama.pid

          echo ""
          echo "=========================================="
          echo "بانتظار جاهزية السيرفر..."
          echo "=========================================="

          READY=0

          # 120 محاولة × 5 ثواني = 10 دقائق
          for i in $(seq 1 120); do

            # هل العملية ما زالت موجودة؟
            if ! kill -0 "$LLAMA_PID" 2>/dev/null; then
              echo ""
              echo "❌ llama serve توقف قبل أن يصبح جاهزًا."

              echo ""
              echo "=========================================="
              echo "آخر llama.log"
              echo "=========================================="

              cat llama.log || true

              exit 1
            fi

            # فحص health endpoint
            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 5 \
              http://127.0.0.1:8080/health \
              > /dev/null 2>&1; then

              echo ""
              echo "✅ السيرفر أصبح جاهزًا."

              READY=1
              break
            fi

            echo "المحاولة $i/120 - السيرفر لسه بيجهز..."

            # كل 10 محاولات اطبع آخر اللوج
            if (( i % 10 == 0 )); then
              echo ""
              echo "----- آخر llama.log -----"
              tail -n 30 llama.log || true
              echo "-------------------------"
            fi

            sleep 5
          done

          # ========================================================
          # التأكد أن السيرفر أصبح جاهزًا فعلًا
          # ========================================================
          if [ "$READY" -ne 1 ]; then

            echo ""
            echo "❌ السيرفر لم يصبح جاهزًا خلال 10 دقائق."

            echo ""
            echo "=========================================="
            echo "آخر llama.log"
            echo "=========================================="

            tail -n 200 llama.log || true

            echo ""
            echo "إيقاف llama..."

            kill "$LLAMA_PID" 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "LLAMA SERVER READY"
          echo "=========================================="

          echo "PID: $LLAMA_PID"
          echo "URL: http://127.0.0.1:8080"

          echo ""
          echo "Health:"
          curl --fail http://127.0.0.1:8080/health

          echo ""
          echo ""
          echo "آخر logs:"
          tail -n 50 llama.log || true

      # ============================================================
      # 4) تشغيل Cloudflare Tunnel
      # ============================================================
      - name: فتح Cloudflare Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "تشغيل Cloudflare Tunnel"
          echo "=========================================="

          rm -f tunnel.log

          cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:8080 \
            > tunnel.log 2>&1 &

          TUNNEL_PID=$!

          echo "Tunnel PID:"
          echo "$TUNNEL_PID"

          echo "$TUNNEL_PID" > tunnel.pid

          echo ""
          echo "بانتظار رابط Cloudflare..."

          TUNNEL_URL=""

          # ننتظر حتى 60 ثانية
          for i in $(seq 1 60); do

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo ""
              echo "❌ cloudflared توقف."

              echo ""
              echo "=========================================="
              echo "cloudflared log"
              echo "=========================================="

              cat tunnel.log || true

              exit 1
            fi

            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 1
          done

          echo ""
          echo "=================================================="

          if [ -n "$TUNNEL_URL" ]; then
            echo "✅ رابط الاختبار:"
            echo ""
            echo "$TUNNEL_URL"
            echo ""
            echo "=================================================="

            # نخليه ظاهر في GitHub Actions كـ output
            echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          else
            echo "❌ لم يتم الحصول على رابط Cloudflare."

            echo ""
            echo "=========================================="
            echo "cloudflared log"
            echo "=========================================="

            cat tunnel.log || true

            echo "=================================================="

            exit 1
          fi

          echo ""
          echo "Cloudflare Tunnel logs:"
          tail -n 30 tunnel.log || true

      # ============================================================
      # 5) التأكد أن السيرفر + النفق ما زالوا شغالين
      # ============================================================
      - name: فحص السيرفر والنفق
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "فحص نهائي"
          echo "=========================================="

          if [ ! -f llama.pid ]; then
            echo "❌ llama.pid غير موجود."
            exit 1
          fi

          LLAMA_PID=$(cat llama.pid)

          if kill -0 "$LLAMA_PID" 2>/dev/null; then
            echo "✅ llama server ما زال يعمل."
          else
            echo "❌ llama server توقف."

            echo ""
            echo "آخر logs:"
            tail -n 200 llama.log || true

            exit 1
          fi

          echo ""
          echo "Health check:"

          if curl \
            --silent \
            --show-error \
            --fail \
            --max-time 10 \
            http://127.0.0.1:8080/health \
            > /dev/null; then

            echo "✅ localhost:8080 شغال."

          else

            echo "❌ localhost:8080 لا يستجيب."

            tail -n 200 llama.log || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "كل شيء جاهز."
          echo "=========================================="

          echo ""
          echo "الرابط:"
          echo "${TUNNEL_URL:-غير معروف}"

      # ============================================================
      # 6) إبقاء الـ workflow شغال
      # ============================================================
      - name: إبقاء الجلسة شغالة للاختبار اليدوي
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "الخادم شغال للاختبار"
          echo "=========================================="

          echo ""
          echo "رابط Cloudflare:"
          echo "${TUNNEL_URL:-غير معروف}"

          echo ""
          echo "يمكنك الآن اختبار الـ API."

          echo ""
          echo "سيظل الـ workflow شغالًا حتى يتم إلغاؤه أو انتهاء الـ timeout."

          # حوالي 5.5 ساعات
          sleep 19800
