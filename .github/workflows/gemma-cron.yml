name: Gemma 4 GGUF Runner

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-gemma-gguf:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Hugging Face Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gemma-4-12b-Q4_K_M

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install llama-cpp-python huggingface-hub

      - name: Run Gemma 4 with llama.cpp
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c '
          import os
          from huggingface_hub import hf_hub_download
          from llama_cpp import Llama

          REPO_ID = "unsloth/gemma-4-12b-it-GGUF"
          FILENAME = "gemma-4-12b-it-Q4_K_M.gguf"

          print("--- بفضل الله: جارٍ تحميل ملف GGUF ---")
          model_path = hf_hub_download(
              repo_id=REPO_ID,
              filename=FILENAME,
              token=os.environ.get("HF_TOKEN")
          )

          print("--- بفضل الله: تهيئة محرك llama.cpp ---")
          llm = Llama(
              model_path=model_path,
              n_ctx=2048,
              n_threads=2,
              verbose=False
          )

          print("--- إرسال الطلب للموديل ---")
          response = llm.create_chat_completion(
              messages=[
                  {"role": "system", "content": "You are a helpful assistant."},
                  {"role": "user", "content": "Confirm that llama.cpp execution is working properly."}
              ],
              max_tokens=128,
              temperature=0.7
          )

          print("--- النتيجة بفضل الله ---")
          print(response["choices"][0]["message"]["content"])
          '
