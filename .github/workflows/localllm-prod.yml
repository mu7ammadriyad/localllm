name: localllm-prod

on:
  workflow_dispatch:

jobs:
  test-localllm:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install llama
        run: |
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cloudflared
        run: |
          curl -L --fail -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Start llama server
        shell: bash
        run: |
          THREADS=$(nproc)

          nohup llama serve \
            -hf "unsloth/gemma-4-E2B-it-GGUF:UD-Q4_K_XL" \
            --host 0.0.0.0 \
            --port 8080 \
            --alias "gemma-4-12b" \
            --ctx-size 16384 \
            --parallel 1 \
            --threads "$THREADS" \
            --threads-batch "$THREADS" \
            > llama.log 2>&1 &

          PID=$!
          echo "$PID" > llama.pid

          echo "Waiting for llama server..."

          for i in $(seq 1 120); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "❌ llama stopped"
              tail -n 100 llama.log
              exit 1
            fi

            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "✅ llama server ready"
              break
            fi

            sleep 5
          done

          curl -sf http://127.0.0.1:8080/health >/dev/null || {
            echo "❌ llama server not ready"
            tail -n 200 llama.log
            exit 1
          }

          echo "✅ Web UI: http://127.0.0.1:8080"
          echo "✅ OpenAI API: http://127.0.0.1:8080/v1/chat/completions"

      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          nohup cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:8080 \
            > tunnel.log 2>&1 &

          TUNNEL_PID=$!
          echo "$TUNNEL_PID" > tunnel.pid

          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              echo "BASE_URL=$URL" >> "$GITHUB_ENV"
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "❌ Cloudflare Tunnel stopped"
              cat tunnel.log
              exit 1
            fi

            sleep 1
          done

          if [ -z "${URL:-}" ]; then
            echo "❌ Tunnel URL not found"
            cat tunnel.log
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "✅ WEB UI"
          echo "$URL"
          echo ""
          echo "✅ OPENAI BASE URL"
          echo "$URL/v1"
          echo ""
          echo "✅ CHAT COMPLETIONS"
          echo "$URL/v1/chat/completions"
          echo "=================================================="

      - name: Test OpenAI endpoint
        shell: bash
        run: |
          echo "Testing /v1/chat/completions..."

          curl -sS --fail \
            "$BASE_URL/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gemma-4-12b",
              "messages": [
                {
                  "role": "user",
                  "content": "قول كلمة واحدة: مرحبا"
                }
              ],
              "stream": false,
              "max_tokens": 32
            }'

          echo ""
          echo "✅ OpenAI-compatible endpoint works"

      - name: Keep alive
        run: |
          echo "✅ Web UI: $BASE_URL"
          echo "✅ OpenAI Base URL: $BASE_URL/v1"
          echo "✅ Endpoint: $BASE_URL/v1/chat/completions"
          sleep 19800
